[package]
name = "mura-settingsd"
version = "0.1.0"
edition = "2021"
description = "Mura settings daemon: org.mura.Settings1 over the generated schema artifact (specs/settings-schema.md, specs/settings-daemon.md)"
license = "GPL-3.0-or-later"

[[bin]]
name = "mura-settingsd"
path = "src/main.rs"

[[bin]]
name = "mura-settings"
path = "src/bin/mura-settings.rs"

# TEST-ONLY: a stand-in that owns the bus name and answers with a wrong value, for
# specs/settings-schema.md §9 item 8 (a consumer of a locked key must not believe the bus).
[[bin]]
name = "mura-settingsd-liar"
path = "src/bin/liar.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# research/58 §11: the Rust desktop comparables' D-Bus stack; the async-io executor and the
# blocking API measured at +0.9 MB / +1 MB RSS / 3 threads against a libc-only binary. Never
# tokio's multi-thread runtime (34 threads on this host).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = false
panic = "abort"
