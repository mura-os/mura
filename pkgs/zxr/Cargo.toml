[package]
name = "zxr"
version = "0.1.0"
edition = "2021"
description = "Mura's compositor: one OpenXR client of Monado, one Wayland compositor (specs/zxr-core.md)"
license = "GPL-3.0-or-later"
build = "build.rs"

[dependencies]
libc = "0.2"
# The Wayland frontend and helpers; renderer-free (research/39 §1.1). Pinned to the rev niri pins
# (references/smithay) with an explicit feature list: no GL/pixman renderers, no winit, no
# in-process Xwayland (satellite — ADR 0006 amendment 2026-09-26).
smithay = { git = "https://github.com/Smithay/smithay.git", rev = "79bbed5e1199090d787115614847a79c76607181", default-features = false, features = ["wayland_frontend", "backend_drm", "backend_vulkan", "desktop", "backend_libinput", "backend_udev", "backend_session_libseat", "backend_libei"] }
# smithay's calloop, plus the signals source (SIGUSR1 journal dump, SIGINT/SIGTERM).
calloop = { version = "0.14", features = ["signals"] }
# The runtime boundary (research/39 §1.9): XR_KHR_vulkan_enable2 end to end; the loader is
# dlopen'd by path (`Entry::load_from`), baked by Nix as MURA_OPENXR_LOADER.
openxr = { version = "0.22", default-features = false, features = ["loaded"] }
# The renderer's Vulkan (the device is the runtime's); the version smithay's backend_vulkan uses.
ash = "0.38"
tracing = "0.1"
# Xcursor theme lookup and parsing for cursor-shape-v1 names (spatial-input §7; input/theme.rs).
xcursor = "0.3"
# The settings engine, in-process (research/73 §6 option b, ruled): the artifact + the per-user
# store resolved with the daemon's own code, the store directory watched with one inotify fd on
# the state loop — no bus, no thread (`bus` off keeps zbus out of the compositor). serde_json is
# the engine's value type; both are already in the closure through the daemon.
mura-settingsd = { path = "../mura-settingsd", default-features = false }
serde_json = "1"
# The window-management seam (protocols/zxr-window-management-v1.xml) is generated at build time
# from the XML, as cosmic-comp does for its protocols; the versions are the ones smithay pins.
wayland-scanner = "0.31"
wayland-backend = "0.3"
bitflags = "2" # the generated bitfield enums (`capability`, `flags`, `resize_edge`)
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
# The seam's proof client (src/bin/zxr-test-manager.rs) only; never in the product closure.
wayland-client = { version = "0.31", optional = true }

[features]
test-manager = ["wayland-client"]

[[bin]]
name = "zxr-test-manager"
required-features = ["test-manager"]

[profile.release]
opt-level = 2
debug = 1
panic = "abort"
