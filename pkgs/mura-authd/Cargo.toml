[package]
name = "mura-authd"
version = "0.1.0"
edition = "2021"
description = "Mura lock-path PAM helper (specs/session-auth.md §2) and its conformance harness"
license = "GPL-3.0-or-later"

[[bin]]
name = "mura-authd"
path = "src/main.rs"

[[bin]]
name = "mura-authd-harness"
path = "src/bin/harness.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
debug = false
panic = "abort"
